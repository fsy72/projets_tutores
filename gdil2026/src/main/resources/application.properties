spring.application.name=gdil2026
server.port=8080
server.servlet.session.persistent=false
spring.datasource.url=jdbc:mysql://localhost:3306/projets_tutores
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-minutes=30
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200,https://tanning-sushi-sandstone.ngrok-free.dev}
